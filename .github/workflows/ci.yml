# CI do NEXUS OS — valida cada Pull Request e cada push na main.
#
# Regras:
#  - NUNCA usa credenciais ou bancos de produção. O Postgres é um container
#    isolado criado e destruído a cada execução.
#  - NUNCA roda migrações contra produção.
#  - Segredos de teste são gerados na hora (não ficam no repositório nem nos logs).
#
# Os nomes dos jobs abaixo são os "status checks" exigidos pela proteção da main
# (ver docs/CI_CD_E_DEPLOY.md). Renomear um job exige atualizar a proteção.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (TypeScript, Prisma, build, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Postgres 17 com a extensão pgvector (busca semântica da NEXUS AI, migração 202611290000).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_os_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      # Os testes só aceitam localhost:5432/nexus_os_test (trava de segurança deles).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_os_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Segredos de teste efêmeros
        run: |
          JWT=$(openssl rand -hex 32); echo "::add-mask::$JWT"; echo "JWT_SECRET=$JWT" >> "$GITHUB_ENV"
          KEY=$(openssl rand -hex 32); echo "::add-mask::$KEY"; echo "CREDENTIALS_ENCRYPTION_KEY_TESTE=$KEY" >> "$GITHUB_ENV"
          # URL pública de exemplo usada pelo teste de assinatura.
          echo "INFINITEPAY_CHECKOUT_URL=$(grep -E '^INFINITEPAY_CHECKOUT_URL=' .env.example | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - run: npm ci --no-audit --no-fund
      - name: Prisma validate
        run: npx prisma validate
      - name: Prisma generate
        run: npx prisma generate
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build

      - name: Migrações no banco de teste isolado
        run: npx prisma migrate deploy

      # Prova que as migrações versionadas geram EXATAMENTE o schema.prisma.
      # Sem isto, uma mudança no schema sem migração passaria despercebida.
      # Tolera só o índice HNSW do pgvector, que o Prisma não sabe representar (ver o script).
      - name: Schema e migrações em sincronia (drift)
        run: node scripts/verificar-drift.cjs

      - name: Testes (papel postgres)
        run: npx tsx --test --test-concurrency=1 tests/*.test.ts

      # Só quando os scripts de RLS existem na branch (PR #2 em diante).
      - name: RLS + papéis no banco de teste
        if: hashFiles('backend/prisma/seguranca/01_rls_policies.sql') != ''
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          APP_PWD=$(openssl rand -hex 24); echo "::add-mask::$APP_PWD"
          MIG_PWD=$(openssl rand -hex 24); echo "::add-mask::$MIG_PWD"
          # Simula o Supabase: papéis anon/authenticated e o schema public SEM o
          # USAGE padrão para PUBLIC (no Postgres puro todo papel herda esse acesso;
          # no Supabase não — medido em produção: anon sem USAGE em public).
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -c "create role anon nologin" -c "create role authenticated nologin" || true
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -c "REVOKE ALL ON SCHEMA public FROM PUBLIC"
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f prisma/seguranca/01_rls_policies.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -v senha_app="$APP_PWD" -v senha_migrator="$MIG_PWD" -f prisma/seguranca/02_papeis.sql
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -c "GRANT nexus_app TO postgres"
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f prisma/seguranca/04_validacao_rls.sql
          echo "NEXUS_APP_URL=postgresql://nexus_app:$APP_PWD@localhost:5432/nexus_os_test" >> "$GITHUB_ENV"

      - name: Testes com RLS ativo (papel nexus_app, sem BYPASSRLS)
        if: hashFiles('backend/prisma/seguranca/01_rls_policies.sql') != ''
        env:
          NEXUS_TESTE_ESCOPO_PADRAO: sistema
        run: DATABASE_URL="$NEXUS_APP_URL" npx tsx --test --test-concurrency=1 tests/*.test.ts

      # Bloqueante: o backend não tem vulnerabilidade alta nem crítica
      # (restam 2 moderadas do exceljs, sem correção compatível).
      - name: Auditoria de dependências (bloqueia alta/crítica)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (TypeScript, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json
      - name: Testes
        run: npx tsx --test tests/*.test.ts
      - name: Build
        run: npm run build
      # Bloqueante para QUALQUER pacote com falha alta/crítica, com uma exceção
      # explícita e temporária: next (e o postcss embutido nele). A correção exige
      # a migração major para o Next 15.5+/16 (docs/PLANO_EVOLUCAO_DEPENDENCIAS.md).
      - name: Auditoria de dependências (bloqueia alta/crítica, exceto next)
        run: |
          npm audit --omit=dev --json > audit.json || true
          node scripts/verificar-auditoria.cjs audit.json next postcss

  docker:
    name: Imagem Docker do backend (build igual ao Render)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t nexus-backend:ci backend
      # A imagem precisa subir e responder /health mesmo sem banco (liveness não depende dele).
      - name: A imagem inicia e responde /health
        run: |
          JWT=$(openssl rand -hex 32); echo "::add-mask::$JWT"
          docker run -d --name api -p 3333:3333 -e PORT=3333 -e NODE_ENV=production \
            -e JWT_SECRET="$JWT" -e DATABASE_URL=postgresql://ninguem:x@127.0.0.1:1/nada \
            -e SNAPSHOT_AUTO_ENABLED=false -e ML_SYNC_AUTO=false -e SHOPEE_SYNC_AUTO=false nexus-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3333/health; then echo; docker exec api node --version; exit 0; fi
            sleep 2
          done
          docker logs api; exit 1

  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --no-banner --redact --log-opts="${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '-1' }}"
