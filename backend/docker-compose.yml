services:
  postgres:
    image: postgres:15
    container_name: nexus_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexus_os
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: